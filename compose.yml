services:
  # ==================== БАЗА ДАННЫХ ====================
  db:
    image: postgres:18
    container_name: testvalidator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== API ПРИЛОЖЕНИЕ ====================
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: testvalidator-api
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__Default=Host=db;Port=5432;Database=testdb;Username=user;Password=password
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./:/src
      - nuget_cache:/root/.nuget/packages
    working_dir: /src
    command: >
      sh -c "dotnet restore TestValidatorSystem.Api/TestValidatorSystem.Api.csproj &&
             dotnet build -c Release --no-restore TestValidatorSystem.Api/TestValidatorSystem.Api.csproj &&
             ASPNETCORE_URLS=http://+:8080 dotnet TestValidatorSystem.Api/bin/Release/net10.0/TestValidatorSystem.Api.dll"

  # ==================== PGADMIN ====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: testvalidator-pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: 'False'
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/tmp/pgpass:ro
    entrypoint: >
      sh -c "
        cp /tmp/pgpass /var/lib/pgadmin/pgpass &&
        chmod 600 /var/lib/pgadmin/pgpass &&
        /entrypoint.sh
      "

volumes:
  pgdata:
  pgadmin_data:
  nuget_cache: